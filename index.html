(function() {
  function setCookie(name, value, minutes) {
    var expires = "";
    if (minutes) {
      var date = new Date();
      date.setTime(date.getTime() + (minutes*60*1000));
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
  }

  function getReferrerSource() {
    var ref = document.referrer;
    
    // Sem referrer = direct
    if (!ref) {
      return {
        source: "(direct)",
        medium: "(none)"
      };
    }
    
    try {
      var refUrl = new URL(ref);
      var refHostname = refUrl.hostname;
      var currentHostname = window.location.hostname;
      
      // Se o referrer é o próprio domínio = direct
      if (refHostname === currentHostname || refHostname.indexOf('sorteonline.com') > -1) {
        return {
          source: "(direct)",
          medium: "(none)"
        };
      }
      
      // Lista de buscadores
      var searchEngines = [
        {domain: "google.", name: "google"},
        {domain: "bing.", name: "bing"},
        {domain: "yahoo.", name: "yahoo"},
        {domain: "duckduckgo.", name: "duckduckgo"},
        {domain: "baidu.", name: "baidu"},
        {domain: "yandex.", name: "yandex"}
      ];
      
      // Verifica se é organic
      for (var i = 0; i < searchEngines.length; i++) {
        if (refHostname.indexOf(searchEngines[i].domain) > -1) {
          return {
            source: searchEngines[i].name,
            medium: "organic"
          };
        }
      }
      
      // Se não é buscador = referral
      return {
        source: refHostname,
        medium: "referral"
      };
      
    } catch(e) {
      // Erro ao processar referrer = direct
      return {
        source: "(direct)",
        medium: "(none)"
      };
    }
  }

  var params = new URLSearchParams(window.location.search);
  var utms = ["utm_source","utm_medium","utm_campaign","utm_id","utm_term","utm_content"];
  var hasUtm = false;

  // 1. Verifica se tem UTMs na URL
  for (var i = 0; i < utms.length; i++) {
    if (params.get(utms[i])) {
      hasUtm = true;
      break;
    }
  }

  if (hasUtm) {
    // 2. Tem UTMs = salva os valores
    for (var j = 0; j < utms.length; j++) {
      var val = params.get(utms[j]);
      if (val) {
        setCookie(utms[j] + "_gtm", val, 30);
      }
    }
    setCookie("traffic_source_gtm", "utm", 30);
    
  } else {
    // 3. Não tem UTMs = detecta via referrer
    var trafficSource = getReferrerSource();
    
    setCookie("utm_source_gtm", trafficSource.source, 30);
    setCookie("utm_medium_gtm", trafficSource.medium, 30);
    setCookie("utm_campaign_gtm", "(not set)", 30);
    setCookie("traffic_source_gtm", trafficSource.source === "(direct)" ? "direct" : "referral", 30);
  }
})();
